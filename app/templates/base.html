<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Profiles{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    nav a { margin-right: 1rem; }
    .flash.success { background: #e6f7e6; border: 1px solid #9c9; padding: .6rem; border-radius: 6px; }
    .error { color: #c0392b; font-size: .85rem; }
    label { display: block; margin-top: .8rem; font-weight: 600; }
    input, textarea { width: 100%; padding: .5rem; margin-top: .25rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: .55rem 1.1rem; background: #2c6bed; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('main.index') }}">All Users</a>
    <a href="{{ url_for('main.register') }}">Register</a>
  </nav>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<p class="flash {{ cat }}">{{ msg }}</p>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
